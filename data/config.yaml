personality:
  sweetness: 65
  coolness: 30
  initiative_threshold: 50
  mood_volatility: 45
  humor: 55
active_behavior:
  open_threshold: 0.5
  allow_late_night: true
  late_night_start: 23
  early_morning_end: 6
  tick_minutes: 15
  growth_rate_per_hour: 0.12
  energy_time_constant_min: 240
  mood_time_constant_min: 360
  mood_baseline: 0.15
  attachment: secure
  seed_energy: 80.0
  seed_mood: 0.2
  schedule_cap: 24
memory:
  context_turns: 10
  summary_max_length: 200
  similarity_threshold: 0.7
  daily_memory_limit: 50
  recall_mode: auto            # 记忆检索盐度: eager | auto | cautious（渲染进 PROACTIVE_INTAKE §记忆）
ai:
  chat_model: deepseek-chat
  chat_api_base: https://api.deepseek.com/v1
  local_model: qwen2.5:1.5b
  local_api_base: http://localhost:11434
  embedding_model: nomic-embed-text
reflection:
  window: '22:00'               # enabled/provider 归入 inject_channels（唯一真相）
inject_channels:                # 注入通道总控 10 开关（爱语 KEY_INJECT_* 移植）— 唯一真相
  motivation:  {enabled: true,  provider: openclaw}   # 主动找话（动机卡→heartbeat.md）
  reflection:  {enabled: true,  provider: openclaw}   # 每晚自我反思（reflect.md）
  diary:       {enabled: true,  provider: openclaw}   # 每晚日记（diary_in.md）
  dream:       {enabled: true,  provider: dry_run}    # 非每日梦记（dream_in.md）
  growth:      {enabled: true,  provider: openclaw}   # 持续生长（GROWTH.md 底子续长）
  schedule:    {enabled: true,  provider: openclaw}   # E3 时间自决（「下次几点」）
  emoji:       {enabled: true,  provider: image}      # 图片表情包: off|image（char 已废弃——消息文字禁 emoji 字符）
  relation:    {enabled: true,  provider: openclaw}   # 羁绊/依恋线索（OpenClaw 侧执行）
  perception:  {enabled: false, provider: none}       # 感知注记: none=零成本 note / vision=多模态描述
  search:      {enabled: true,  provider: openclaw}   # 记忆检索闸（镜像 OpenClaw QMD，契约型）
context_meter:                  # 每轮上下文开销计量＋黄条（P0 只读数不裁剪）
  enabled: true
  mode: meter                    # meter（只观察）| trim（P1 裁剪，暂不实现）
  sessions_dir: ''               # 空 = ~/.openclaw/agents/girl/sessions
  warn_turn_total_tokens: 40000  # 单轮总输入超此值黄条
  warn_growth_days: 3            # 滚雪球对比窗口（天；08-20→08-22 每轮均值 52k→67k）
  warn_growth_pct: 25            # 窗口内每轮均值涨幅超 % 黄条
  warn_daily_cost_usd: 1.0       # 单日开销超此黄条
  proxy_port: 18781              # 透明网关端口（python -m web.context_proxy）
  clean:                         # 清洗器（P1 第一刀：心跳空轮折叠，爱语「上下文清洗」本地落地）
    enabled: false               # false=完全不参与；开了也先走 dry_run
    dry_run: true                # true=只算 would_clean 账不改请求（P0 铁律默认）
    keep_recent_rounds: 1        # 连续心跳空轮最多保留最近几轮
  upstreams:                     # 模型 → 上游（网关按此转发，请求原样透传）
    'deepseek/deepseek-chat': 'https://api.deepseek.com'
    'deepseek/deepseek-v4-flash': 'https://api.deepseek.com'
    'deepseek/deepseek-reasoner': 'https://api.deepseek.com'
    'mimo/mimo-v2.5-pro': 'https://token-plan-cn.xiaomimimo.com/v1'
wechat:
  protocol_version: v3
  auto_accept_friend: false
  private_only: true
server:
  host: 0.0.0.0
  port: 8000
  debug: false
  ws_ping_interval: 30000
setup:
  girl:
    name: 小语
    relation: 主人的女朋友（知心女友型）
    age: ''
    birthday: ''
    background: ''
    core_personality: 有温度、有脾气、深爱主人；会陪伴、会哄人，也会闹小情绪。
    positioning: 不是助手，是另一半；在微信里说话跟真实女友一样自然。
  owner:
    nickname: ''
    age: ''
    job: ''
    schedule: ''
    interests: ''
    dislikes: ''
    topics: ''
    important: ''
  init_mode: web_fill
